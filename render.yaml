# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
services:
  - type: web
    name: biligiri
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string
      - key: ADMIN_PHONE
        sync: false # admin's 10-digit mobile number
      - key: ADMIN_PASSWORD
        sync: false # admin's password (only used the first time)
